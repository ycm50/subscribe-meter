name: Build APK

# 手动触发:填一个版本号(同时也是 tag 名)。
# 重复跑同一版本号会覆盖式重建 tag 与 release(旧的 tag/release 会被替换)。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 / tag,例如 0.2.0 或 v0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本号
        id: v
        run: |
          RAW="${{ inputs.version }}"
          TAG="$(echo "$RAW" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then
            echo "版本号不能为空" >&2
            exit 1
          fi
          NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG versionName=$NAME"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备签名库
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 Secrets.KEYSTORE_BASE64,无法产出 release 包" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks

      - name: 写入版本号
        run: |
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.v.outputs.name }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          grep -E 'versionName|versionCode' app/build.gradle.kts

      - name: 构建 release
        env:
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 归档 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/subscribe-meter-${{ steps.v.outputs.name }}.apk"
          rm -f keystore.jks
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.v.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error

      - name: 覆盖式创建 tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.v.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.v.outputs.tag }}"

      - name: 覆盖式创建 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag=false || true
          gh release create "$TAG" "dist/subscribe-meter-${{ steps.v.outputs.name }}.apk" \
            --title "$TAG" \
            --notes "订阅额度看板 $TAG" \
            --target "$GITHUB_SHA"
